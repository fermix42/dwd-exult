name: DWD candidate review
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved dwd-v tag at the dispatched commit (blank for untagged review)
        type: string
        required: false
      expected_revision:
        description: Approved full 40-character SHA; must equal the dispatched commit
        type: string
        required: true
      private_free_usage_confirmed:
        description: For private runs only, owner verified sufficient free compute/storage and spending blocked
        type: boolean
        default: false
# No push/tag/release events and no contents:write job. Validation cannot publish.
permissions:
  contents: read
concurrency:
  group: dwd-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Refuse private hosted allocation until free usage has been checked by owner.
    if: ${{ !github.event.repository.private || inputs.private_free_usage_confirmed }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm approved source identity
        shell: pwsh
        env:
          DWD_EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -or $env:DWD_EXPECTED_REVISION -cnotmatch '^[0-9a-f]{40}$' -or $actual -cne $env:DWD_EXPECTED_REVISION -or $actual -cne $env:GITHUB_SHA) {
            throw 'Dispatched commit does not match the explicitly approved full SHA'
          }
          "Approved DWD revision: $actual" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install host parser generators
        shell: pwsh
        run: |
          choco install winflexbison3 --yes --no-progress
          if ($LASTEXITCODE) { throw 'Win Flex/Bison installation failed' }
          Get-Command win_bison.exe, win_flex.exe -ErrorAction Stop | Format-Table Name, Source
      - name: Select upstream-pinned vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content msvcstuff/vs2019/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_INSTALLATION_ROOT fetch origin $baseline
          if ($LASTEXITCODE) { throw 'vcpkg fetch failed' }
          git -C $env:VCPKG_INSTALLATION_ROOT checkout --detach $baseline
          if ($LASTEXITCODE) { throw 'vcpkg checkout failed' }
          & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat"
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
      - name: Install verified free Inno Setup compiler
        shell: pwsh
        run: ./packaging/dwd/install-inno.ps1 -Destination "$env:RUNNER_TEMP/dwd-inno"
      - name: Metadata and release invariants
        shell: pwsh
        run: |
          python packaging/dwd/check.py
          if ($LASTEXITCODE) { throw 'Source/installer invariants failed' }
      - name: Build ordinary Windows executable and upstream resources
        shell: pwsh
        run: ./packaging/dwd/build-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/dwd-bin"
      - name: Stage the native installer path helper (no bundled mod payloads)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/dwd-mods" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/dwd-bin/exconfig-x86_64.exe" "$env:RUNNER_TEMP/dwd-mods/exconfig.exe"
      - name: Collect matching dependency source and build recipes
        shell: pwsh
        run: |
          python packaging/dwd/collect-dependencies.py --installed msvcstuff/vs2019/vcpkg_installed/x64-windows --vcpkg "$env:VCPKG_INSTALLATION_ROOT" --output "$env:RUNNER_TEMP/dwd-sources"
          if ($LASTEXITCODE) { throw 'Dependency source audit failed' }
      - name: Stage and inspect candidate
        shell: pwsh
        env:
          DWD_TAG: ${{ inputs.tag }}
        run: |
          $tagArgs = @()
          if ($env:DWD_TAG) { $tagArgs = @('--tag', $env:DWD_TAG) }
          python packaging/dwd/release.py package --binary-dir "$env:RUNNER_TEMP/dwd-bin" --runtime-dir msvcstuff/vs2019/vcpkg_installed/x64-windows/bin --dependency-share msvcstuff/vs2019/vcpkg_installed/x64-windows/share --output "$env:RUNNER_TEMP/dwd-candidate" --dependency-sources "$env:RUNNER_TEMP/dwd-sources" --installer-tools "$env:RUNNER_TEMP/dwd-mods" --iscc "$env:DWD_ISCC" @tagArgs
          if ($LASTEXITCODE) { throw 'Candidate inspection failed' }
      - name: Audit final archives, hashes, source identity and packaged startup
        shell: pwsh
        run: |
          python packaging/dwd/audit-candidate.py --candidate "$env:RUNNER_TEMP/dwd-candidate" --revision "$env:GITHUB_SHA" --smoke-root "$env:RUNNER_TEMP/dwd-smoke"
          if ($LASTEXITCODE) { throw 'Final artifact/source/startup audit failed' }
          Get-Content "$env:RUNNER_TEMP/dwd-candidate/SHA256SUMS.txt" >> $env:GITHUB_STEP_SUMMARY
          'Game/mod runtime and human acceptance remain separately recorded local evidence, not hosted tests.' >> $env:GITHUB_STEP_SUMMARY
      - name: Verify installer presence and scan available artifacts
        shell: pwsh
        run: |
          # Game-path/mod/runtime tests need legally supplied fixtures and remain
          # local. The full installer checker refuses pre-existing DWD installs.
          $setup = Get-ChildItem "$env:RUNNER_TEMP/dwd-candidate/*-Setup.exe" | Select-Object -First 1
          if (!$setup) { throw 'Installer was not built' }
          $scanner = "$env:ProgramFiles/Windows Defender/MpCmdRun.exe"
          if (Test-Path $scanner) {
            & $scanner -Scan -ScanType 3 -File "$env:RUNNER_TEMP/dwd-candidate" 2>&1 | Tee-Object "$env:RUNNER_TEMP/dwd-defender.log"
            if ($LASTEXITCODE -ne 0) { throw 'Defender scan requires investigation' }
          } else { Write-Output 'Defender NOT TESTED: scanner unavailable' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dwd-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dwd-candidate/*.zip
            ${{ runner.temp }}/dwd-candidate/*-Setup.exe
            ${{ runner.temp }}/dwd-candidate/*.json
            ${{ runner.temp }}/dwd-candidate/*.txt
            ${{ runner.temp }}/dwd-candidate/installer-input/Exult/x86_64/Exult.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve build diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dwd-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dwd-build-logs/*.log
            ${{ runner.temp }}/dwd-defender.log
          if-no-files-found: warn
          retention-days: 7
  attest:
    if: ${{ github.event.repository.private == false }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dwd-candidate-${{ github.sha }}
          path: candidate
      # Untagged immutable candidate attestations are free for public repositories. This is build provenance, not Windows
      # Authenticode signing, and does not suppress SmartScreen warnings.
      - name: Verify transferred artifact hashes
        shell: bash
        run: cd candidate && sha256sum -c SHA256SUMS.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            candidate/*-Setup.exe
            candidate/*-Windows-x64.zip
            candidate/*-Source.zip
            candidate/installer-input/Exult/x86_64/Exult.exe
